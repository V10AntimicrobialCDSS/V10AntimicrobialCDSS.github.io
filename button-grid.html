<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Grid from JSON</title>
<style>
  :root {
    --color-bg: #f7f6f2;
    --color-surface: #f9f8f5;
    --color-text: #28251d;
    --color-text-muted: #7a7974;
    --color-primary: #1a3a5c;
    --color-primary-hover: #0f2540;
    --color-border: #d4d1ca;
    --radius-md: 0.5rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-6: 1.5rem;
    --space-8: 2rem;
    --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
    --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
    --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    padding: var(--space-8);
    max-width: 960px;
    margin-inline: auto;
  }
  h2 { font-size: var(--text-xl); margin-bottom: var(--space-6); }
  .section { margin-bottom: var(--space-8); }
  .section-title {
    font-size: var(--text-lg);
    font-weight: 600;
    margin-bottom: var(--space-4);
    color: var(--color-text);
  }
  hr { border: none; border-top: 1px solid var(--color-border); margin: var(--space-8) 0; }
  .btn-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: var(--space-3);
  }
  .btn {
    display: block;
    width: 100%;
    padding: var(--space-4) var(--space-4);
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: background 180ms ease;
    line-height: 1.4;
  }
  .btn:hover { background: var(--color-primary-hover); }
</style>
</head>
<body>

<h2>Antimicrobial Stewardship Resources</h2>
<div id="app"></div>

<script>
// ── 1. JSON DATA ─────────────────────────────────────────────
const data = {
  sections: [
    {
      title: "Diagnostic Stewardship",
      buttons: [
        { label: "Positive Blood Culture Interpretation", url: "#" },
        { label: "Infectious Diarrhea Testing Algorithm",  url: "#" },
        { label: "Kicking UTI Urine Culturing Algorithm",  url: "#" },
        { label: "Procalcitonin Guidance",                 url: "#" }
      ]
    },
    {
      title: "Additional Resources",
      buttons: [
        { label: "Sanford Guide",                                     url: "#" },
        { label: "Infection Control",                                  url: "#" },
        { label: "PCN Allergy Testing",                                url: "#" },
        { label: "Cefazolin for Perioperative Patients with Penicillin Allergy", url: "#" },
        { label: "Drug Allergy Review Clin Immunol 2022",              url: "#" },
        { label: "OPAT Drug Reference",                                url: "#" },
        { label: "OPAT Flowchart",                                     url: "#" },
        { label: "AAVA Antimicrobial Stewardship Program Charter",     url: "#" },
        { label: "Antimicrobial Stewardship VHA Directive 1031",       url: "#" }
      ]
    }
  ]
};

// ── 2. RENDER ─────────────────────────────────────────────────
const app = document.getElementById("app");

data.sections.forEach((section, i) => {
  const wrapper = document.createElement("div");
  wrapper.className = "section";

  const heading = document.createElement("h3");
  heading.className = "section-title";
  heading.textContent = section.title;
  wrapper.appendChild(heading);

  const grid = document.createElement("div");
  grid.className = "btn-grid";

  section.buttons.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = item.label;
    btn.addEventListener("click", () => {
      if (item.url && item.url !== "#") window.open(item.url, "_blank");
    });
    grid.appendChild(btn);
  });

  wrapper.appendChild(grid);

  if (i < data.sections.length - 1) {
    wrapper.appendChild(document.createElement("br"));
    wrapper.appendChild(document.createElement("hr"));
  }

  app.appendChild(wrapper);
});
</script>
</body>
</html>
